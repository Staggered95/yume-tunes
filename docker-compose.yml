services:
  db:
    image: postgres:15-alpine
    container_name: yumetunes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: yumetunes-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./.env 
    environment:
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      - db
    volumes:
      - ./server/public:/public

  

  gateway:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: yumetunes-gateway
    restart: unless-stopped
    ports:
      - "80:80"     
      - "443:443"   
    volumes:
      # Mount the root nginx.conf to the gateway
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Gateway needs access to server media to serve audio efficiently
      - ./server/public:/usr/share/nginx/html/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - api

volumes:
  pgdata:
